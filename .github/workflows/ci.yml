name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The seed file is generated; fail if it drifts from scripts/build_seed.py.
      - run: uv run python scripts/build_seed.py && git diff --exit-code data/
      - run: uv run pytest -q
