[project]
name = "hebrew-toolbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YuvGev00", email = "yuvgev1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyluach>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
hebrew-toolbench = "hebrew_toolbench.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"
# Hand-authored item data; one item per call reads better unwrapped.
extend-exclude = ["scripts/build_seed.py", "scripts/packs/pack_*.py"]

[tool.ruff.format]
exclude = ["scripts/tools.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Hebrew geresh/gershayim and typographic quotes are intentional in this codebase.
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/tools.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pyluach", "pyluach.*"]
ignore_missing_imports = true
